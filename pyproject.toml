[project]
name = "aurora"
version = "0.1.0"
description = "Assistente do Residencial Aurora (Google ADK + FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.11.0",
    "fastapi",
    "uvicorn",
    "python-dotenv",
]

[project.scripts]
aurora-api = "aurora.main:run"
aurora-restore = "aurora.storage.carga:main"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
